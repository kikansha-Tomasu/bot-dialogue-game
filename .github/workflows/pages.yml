name: Deploy Bot対話ゲーム to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site artifact (game assets only)
        run: |
          mkdir -p _site
          cp index.html colors.js .nojekyll _site/
          cp -r css js characters _site/
          mkdir -p _site/map-assets/assets
          cp -r map-assets/assets/maps map-assets/assets/town_blocks map-assets/assets/progression_layers _site/map-assets/assets/
          rm -rf _site/map-assets/assets/town_blocks/docs _site/map-assets/assets/town_blocks/source

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
