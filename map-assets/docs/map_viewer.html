<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Agent Town Map Viewer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef3e8;
      color: #27332b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    aside {
      border-right: 1px solid #d6dfd0;
      background: #fbfcf7;
      padding: 20px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      letter-spacing: 0;
    }

    button {
      width: 100%;
      border: 1px solid #c9d5c0;
      background: #fff;
      color: #27332b;
      border-radius: 6px;
      padding: 10px 12px;
      margin: 0 0 8px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    button[aria-pressed="true"] {
      background: #dfead6;
      border-color: #8faa7f;
    }

    .controlGroup {
      border-top: 1px solid #dfe6da;
      margin-top: 18px;
      padding-top: 16px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
    }

    .rangeLabel {
      align-items: stretch;
      flex-direction: column;
      gap: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #5f8d4e;
    }

    .value {
      color: #5f735f;
      font-variant-numeric: tabular-nums;
    }

    main {
      min-width: 0;
      padding: 22px;
      overflow: auto;
    }

    .meta {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 22px;
      margin: 0;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #596a5d;
      font-size: 14px;
    }

    canvas {
      display: block;
      background: #f6f8ef;
      border: 1px solid #d7dfd1;
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      image-rendering: auto;
    }

    @media (max-width: 780px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid #d6dfd0;
      }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Town Maps</h1>
    <div id="mapButtons"></div>
    <div class="controlGroup">
      <label class="rangeLabel">
        <span>街の発展 <span id="developmentValue" class="value">3</span></span>
        <input id="developmentLevel" type="range" min="0" max="5" value="3">
      </label>
      <label class="rangeLabel">
        <span>作物ステージ <span id="cropValue" class="value">3</span></span>
        <input id="cropStage" type="range" min="0" max="3" value="3">
      </label>
      <label><input id="developmentToggle" type="checkbox" checked> 発展レイヤー</label>
      <label><input id="cropToggle" type="checkbox" checked> 作物レイヤー</label>
      <label><input id="collisionToggle" type="checkbox" checked> 当たり判定</label>
    </div>
  </aside>
  <main>
    <div class="meta">
      <h2 id="mapName"></h2>
      <p id="mapDescription"></p>
    </div>
    <canvas id="mapCanvas"></canvas>
  </main>
  <script>
    const canvas = document.querySelector("#mapCanvas");
    const ctx = canvas.getContext("2d");
    const buttons = document.querySelector("#mapButtons");
    const collisionToggle = document.querySelector("#collisionToggle");
    const developmentToggle = document.querySelector("#developmentToggle");
    const cropToggle = document.querySelector("#cropToggle");
    const developmentLevel = document.querySelector("#developmentLevel");
    const developmentValue = document.querySelector("#developmentValue");
    const cropStage = document.querySelector("#cropStage");
    const cropValue = document.querySelector("#cropValue");
    const mapName = document.querySelector("#mapName");
    const mapDescription = document.querySelector("#mapDescription");

    let mapsDoc;
    let atlasDoc;
    let progressionDoc;
    let activeMap;
    const images = new Map();
    const tileImages = new Map();
    const overlayImages = new Map();
    const baseTileImages = new Map();

    async function loadJson(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`Failed to load ${path}`);
      return response.json();
    }

    function imageFor(assetId) {
      return images.get(assetId);
    }

    function tileFor(assetId) {
      return tileImages.get(assetId);
    }

    function overlayFor(assetId) {
      return overlayImages.get(assetId);
    }

    function baseTileFor(assetId) {
      return baseTileImages.get(assetId);
    }

    function roadBaseFor(assetId, level) {
      const roadTile = baseTileFor(`${assetId}_level_${level}`);
      return roadTile || tileFor(assetId);
    }

    function isRoadBase(assetId) {
      return ["road_straight", "road_corner", "road_t", "road_cross", "dirt_path"].includes(assetId);
    }

    function shouldPlaceOverlay(asset, x, y, salt = 0) {
      const value = (x * 37 + y * 57 + activeMap.id.length * 19 + asset.id.length * 11 + salt) % 100;
      if (asset.stage <= 1) return value < 18;
      if (asset.stage === 2) return value < 24;
      if (asset.stage === 3) return value < 16;
      return value < 10;
    }

    function cropForCell(x, y) {
      const crops = ["carrot", "tomato", "wheat", "cabbage", "corn", "pumpkin", "strawberry", "rice"];
      return crops[(x * 5 + y * 3 + activeMap.id.length) % crops.length];
    }

    function drawOverlay(assetId, x, y, tile) {
      const image = overlayFor(assetId);
      if (image) ctx.drawImage(image, x, y, tile, tile);
    }

    function townOverlaysFor(baseId, level, type = "terrain") {
      const assets = progressionDoc.assets.filter(asset =>
        asset.type === "development_overlay" &&
        asset.stage <= level &&
        asset.targetBase.includes(baseId)
      );
      if (type === "object") {
        return assets.filter(asset => ["construction_scaffold", "solar_panels", "clock_tower_upgrade"].includes(asset.id));
      }
      return assets.filter(asset => !["construction_scaffold", "solar_panels", "clock_tower_upgrade"].includes(asset.id));
    }

    async function preloadImages() {
      const jobs = [];
      for (const asset of atlasDoc.assets) {
        jobs.push(new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            images.set(asset.id, img);
            resolve();
          };
          img.onerror = reject;
          img.src = `../assets/town_blocks/${asset.file}`;
        }));
        jobs.push(new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            tileImages.set(asset.id, img);
            resolve();
          };
          img.onerror = reject;
          img.src = `../assets/town_blocks/${asset.seamlessTileFile}`;
        }));
      }
      for (const tile of progressionDoc.baseTiles) {
        jobs.push(new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            baseTileImages.set(tile.id, img);
            resolve();
          };
          img.onerror = reject;
          img.src = `../assets/progression_layers/${tile.file}`;
        }));
      }
      for (const asset of progressionDoc.assets) {
        jobs.push(new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            overlayImages.set(asset.id, img);
            resolve();
          };
          img.onerror = reject;
          img.src = `../assets/progression_layers/${asset.file}`;
        }));
      }
      await Promise.all(jobs);
    }

    function draw() {
      const tile = mapsDoc.tileSize;
      const level = Number(developmentLevel.value);
      const crop = Number(cropStage.value);
      developmentValue.textContent = String(level);
      cropValue.textContent = String(crop);
      const margin = 24;
      const titlePad = 0;
      canvas.width = activeMap.width * tile + margin * 2;
      canvas.height = activeMap.height * tile + margin * 2 + titlePad;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f7f8ee";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const ox = margin;
      const oy = margin + titlePad;
      for (let y = 0; y < activeMap.terrain.length; y += 1) {
        const row = activeMap.terrain[y];
        for (let x = 0; x < row.length; x += 1) {
          const assetId = activeMap.legend[row[x]];
          const px = ox + x * tile;
          const py = oy + y * tile;
          const useCropBase = cropToggle.checked && assetId === "farm_plot";
          const useRoadBase = developmentToggle.checked && isRoadBase(assetId) && level > 0;
          const base = useCropBase ? baseTileFor("farm_soil") : (useRoadBase ? roadBaseFor(assetId, level) : tileFor(assetId));
          ctx.drawImage(base, px, py, tile, tile);
          if (cropToggle.checked && assetId === "farm_plot") {
            drawOverlay(`${cropForCell(x, y)}_stage_${crop}`, px, py, tile);
          }
          if (developmentToggle.checked && !isRoadBase(assetId)) {
            for (const overlay of townOverlaysFor(assetId, level, "terrain")) {
              if (shouldPlaceOverlay(overlay, x, y)) {
                drawOverlay(overlay.id, px, py, tile);
              }
            }
          }
        }
      }

      const assetById = Object.fromEntries(atlasDoc.assets.map(asset => [asset.id, asset]));
      const sortedObjects = [...activeMap.objects].sort((a, b) => a.y - b.y || a.x - b.x);
      for (const item of sortedObjects) {
        const px = ox + item.x * tile;
        const py = oy + item.y * tile;
        if (developmentToggle.checked && level === 1 && shouldPlaceOverlay({ id: "construction_foundation", stage: 1 }, item.x, item.y, 7)) {
          drawOverlay("construction_foundation", px, py, tile);
        }
        ctx.drawImage(imageFor(item.asset), px, py, tile, tile);
        if (developmentToggle.checked) {
          for (const overlay of townOverlaysFor(item.asset, level, "object")) {
            if (overlay.id === "construction_scaffold" && level !== 2) continue;
            if (overlay.id === "clock_tower_upgrade" && item.asset !== "town_hall") continue;
            drawOverlay(overlay.id, px, py, tile);
          }
        }
        const collision = assetById[item.asset].collision;
        if (collisionToggle.checked && collision.type === "rect" && collision.solid) {
          const scale = tile / mapsDoc.sourceTileSize;
          const x = ox + item.x * tile + collision.x * scale;
          const y = oy + item.y * tile + collision.y * scale;
          const w = collision.w * scale;
          const h = collision.h * scale;
          ctx.fillStyle = "rgba(245,51,58,.16)";
          ctx.strokeStyle = "rgba(245,51,58,.9)";
          ctx.lineWidth = 2;
          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }
      }

      const sx = ox + activeMap.spawn.x * tile + tile / 2;
      const sy = oy + activeMap.spawn.y * tile + tile / 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#2478ff";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    }

    function setActiveMap(map) {
      activeMap = map;
      mapName.textContent = map.name;
      mapDescription.textContent = map.description;
      for (const button of buttons.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", button.dataset.mapId === map.id ? "true" : "false");
      }
      draw();
    }

    async function init() {
      [mapsDoc, atlasDoc] = await Promise.all([
        loadJson("../assets/maps/town_maps.json"),
        loadJson("../assets/town_blocks/atlas.json")
      ]);
      progressionDoc = await loadJson("../assets/progression_layers/progression_layers.json");
      await preloadImages();
      for (const map of mapsDoc.maps) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.mapId = map.id;
        button.textContent = map.name;
        button.addEventListener("click", () => setActiveMap(map));
        buttons.append(button);
      }
      collisionToggle.addEventListener("change", draw);
      developmentToggle.addEventListener("change", draw);
      cropToggle.addEventListener("change", draw);
      developmentLevel.addEventListener("input", draw);
      cropStage.addEventListener("input", draw);
      setActiveMap(mapsDoc.maps[0]);
    }

    init().catch(error => {
      document.body.textContent = error.message;
    });
  </script>
</body>
</html>
